services:
  - type: web
    name: penny-surveys
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn PennySurveys.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        value: "CHANGE-ME-IN-RENDER-DASHBOARD"
      - key: DATABASE_URL
        value: ""
