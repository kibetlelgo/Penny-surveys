{% extends 'surveys/base.html' %}
{% block title %}Login | PennySurveys{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
  html, body {
    height: 100%;
    min-height: 100vh;
    background: linear-gradient(120deg, #6366f1 0%, #3b82f6 100%) !important;
  }
  .login-bg {
    min-height: 100vh;
    height: 100vh;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .login-card {
    background: #fff;
    border-radius: 1.25rem;
    box-shadow: 0 8px 32px rgba(60,72,120,0.12);
    max-width: 420px;
    width: 100%;
    padding: 2.5rem 2rem 2rem 2rem;
    margin: 0 auto;
  }
  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .login-brand .iconify {
    font-size: 2.8rem;
    color: #6366f1;
    margin-bottom: 0.5rem;
  }
  .login-brand .brand-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #222;
  }
  .login-title {
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 0.25rem;
    color: #222;
  }
  .login-subtext {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #888;
    font-size: 1rem;
  }
  .login-subtext a {
    color: #fd7e14;
    text-decoration: none;
    font-weight: 500;
  }
  .login-subtext a:hover {
    text-decoration: underline;
  }
  .form-control, .form-select {
    border-radius: 0.75rem;
    font-size: 1rem;
    padding-left: 2.5rem;
  }
  .form-group {
    position: relative;
    margin-bottom: 1.1rem;
  }
  .form-group .iconify {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: #6366f1;
    font-size: 1.2rem;
    pointer-events: none;
  }
  .orange-btn {
    background: #fd7e14;
    color: #fff;
    border: none;
    border-radius: 0.75rem;
    font-weight: 600;
    font-size: 1.1rem;
    width: 100%;
    padding: 0.75rem 0;
    margin-top: 0.5rem;
    transition: box-shadow 0.2s, background 0.2s;
    box-shadow: 0 2px 8px rgba(99,102,241,0.08);
  }
  .orange-btn:hover, .orange-btn:focus {
    box-shadow: 0 4px 16px rgba(99,102,241,0.18);
    color: #fff;
    background: #ff9800;
  }
  
  /* Password visibility toggle styles */
  .password-field {
    position: relative;
  }
  
  .password-field .form-control {
    padding-right: 4rem;
  }
  
  .password-toggle {
    position: absolute;
    right: 1.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #6366f1;
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 0.25rem;
    transition: color 0.2s;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
  }
  
  .password-toggle:hover {
    color: #4f46e5;
    background-color: rgba(99, 102, 241, 0.1);
  }
  
  .password-toggle .iconify {
    font-size: 1.1rem;
  }
</style>
<div class="login-bg">
  <div class="login-card">
    <div class="login-brand">
      <span class="iconify" data-icon="mdi:clipboard-text-outline"></span>
      <span class="brand-title">PennySurveys</span>
    </div>
    <div class="login-title">Sign in to your account</div>
    <div class="login-subtext">Don't have an account? <a href="/register/">Create account</a></div>
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <span class="iconify" data-icon="mdi:account-outline"></span>
        <input type="text" name="username" class="form-control" placeholder="Username" required value="{{ form.username.value|default:'' }}">
      </div>
      <div class="form-group password-field">
        <span class="iconify" data-icon="mdi:lock-outline"></span>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button type="button" class="password-toggle" onclick="togglePassword('password')">
          <span class="iconify" data-icon="mdi:eye-outline"></span>
        </button>
      </div>
      <button type="submit" class="orange-btn">Sign In <span class="iconify" data-icon="mdi:arrow-right"></span></button>
    </form>
  </div>
</div>

<script>
  function togglePassword(fieldName) {
    const passwordField = document.querySelector(`input[name="${fieldName}"]`);
    const passwordContainer = passwordField.closest('.password-field');
    const toggleButton = passwordContainer.querySelector('.password-toggle');
    const icon = toggleButton.querySelector('.iconify');
    
    if (passwordField.type === 'password') {
      passwordField.type = 'text';
      icon.setAttribute('data-icon', 'mdi:eye-off-outline');
    } else {
      passwordField.type = 'password';
      icon.setAttribute('data-icon', 'mdi:eye-outline');
    }
  }
</script>
{% endblock %}
