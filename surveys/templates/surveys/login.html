{% extends 'surveys/base.html' %}
{% block title %}Login | PennySurveys{% endblock %}
{% block content %}
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
  html, body {
    height: 100%;
    min-height: 100vh;
    background:
      radial-gradient(circle at top, rgba(217, 175, 95, 0.14), transparent 26%),
      linear-gradient(135deg, #090d14 0%, #111827 38%, #0f172a 100%) !important;
  }
  .login-bg {
    min-height: 100vh;
    height: 100vh;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .login-card {
    background: rgba(15, 23, 42, 0.84);
    border: 1px solid rgba(217, 175, 95, 0.22);
    border-radius: 1.4rem;
    box-shadow: 0 28px 60px rgba(0, 0, 0, 0.28);
    max-width: 420px;
    width: 100%;
    padding: 2.5rem 2rem 2rem 2rem;
    margin: 0 auto;
  }
  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .login-brand .iconify {
    font-size: 2.8rem;
    color: #d9af5f;
    margin-bottom: 0.5rem;
  }
  .login-brand .brand-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #f8fafc;
  }
  .login-title {
    font-size: 1.35rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 0.25rem;
    color: #f8fafc;
  }
  .login-subtext {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #cbd5e1;
    font-size: 1rem;
  }
  .login-subtext a {
    color: #f3d79c;
    text-decoration: none;
    font-weight: 500;
  }
  .login-subtext a:hover {
    text-decoration: underline;
  }
  .form-control, .form-select {
    border-radius: 0.9rem;
    font-size: 1rem;
    padding-left: 2.5rem;
    background: rgba(15, 23, 42, 0.76) !important;
    border: 1px solid rgba(217, 175, 95, 0.16) !important;
    color: #fff !important;
  }
  .form-group {
    position: relative;
    margin-bottom: 1.1rem;
  }
  .form-group .iconify {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: #d9af5f;
    font-size: 1.2rem;
    pointer-events: none;
  }
  .orange-btn {
    background: linear-gradient(135deg, #d9af5f 0%, #b77a2b 100%);
    color: #111827;
    border: none;
    border-radius: 999px;
    font-weight: 800;
    font-size: 1.1rem;
    width: 100%;
    padding: 0.75rem 0;
    margin-top: 0.5rem;
    transition: box-shadow 0.2s, transform 0.2s;
    box-shadow: 0 12px 25px rgba(217, 175, 95, 0.2);
  }
  .orange-btn:hover, .orange-btn:focus {
    box-shadow: 0 16px 32px rgba(217, 175, 95, 0.25);
    color: #111827;
    transform: translateY(-1px);
    background: linear-gradient(135deg, #e3c17a 0%, #c28632 100%);
  }
  
  /* Password visibility toggle styles */
  .password-field {
    position: relative;
  }
  
  .password-field .form-control {
    padding-right: 4rem;
  }
  
  .password-toggle {
    position: absolute;
    right: 1.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #6366f1;
    cursor: pointer;
    padding: 0.25rem;
    border-radius: 0.25rem;
    transition: color 0.2s;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
  }
  
  .password-toggle:hover {
    color: #4f46e5;
    background-color: rgba(99, 102, 241, 0.1);
  }
  
  .password-toggle .iconify {
    font-size: 1.1rem;
  }
</style>
<div class="login-bg">
  <div class="login-card">
    <div class="login-brand">
      <span class="iconify" data-icon="mdi:clipboard-text-outline"></span>
      <span class="brand-title">PennySurveys</span>
    </div>
    <div class="login-title">Sign in to your account</div>
    <div class="login-subtext">Don't have an account? <a href="/register/">Create account</a></div>
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <span class="iconify" data-icon="mdi:account-outline"></span>
        <input type="text" name="username" class="form-control" placeholder="Username" required value="{{ form.username.value|default:'' }}">
      </div>
      <div class="form-group password-field">
        <span class="iconify" data-icon="mdi:lock-outline"></span>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button type="button" class="password-toggle" onclick="togglePassword('password')">
          <span class="iconify" data-icon="mdi:eye-outline"></span>
        </button>
      </div>
      <button type="submit" class="orange-btn">Sign In <span class="iconify" data-icon="mdi:arrow-right"></span></button>
    </form>
  </div>
</div>

<script>
  function togglePassword(fieldName) {
    const passwordField = document.querySelector(`input[name="${fieldName}"]`);
    const passwordContainer = passwordField.closest('.password-field');
    const toggleButton = passwordContainer.querySelector('.password-toggle');
    const icon = toggleButton.querySelector('.iconify');
    
    if (passwordField.type === 'password') {
      passwordField.type = 'text';
      icon.setAttribute('data-icon', 'mdi:eye-off-outline');
    } else {
      passwordField.type = 'password';
      icon.setAttribute('data-icon', 'mdi:eye-outline');
    }
  }
</script>
{% endblock %}
